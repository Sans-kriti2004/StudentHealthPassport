<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Health Passport - School Emergency Medical System</title>
  
  <!-- Tailwind CSS via CDN for rapid high-performance styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Medical Styles & Print Layout -->
  <link rel="stylesheet" href="src/css/styles.css">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📇</text></svg>">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col selection:bg-sky-500 selection:text-white">

  <!-- TOP BRAND & EMERGENCY ACTION HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-3">
        
        <!-- Logo & Challenge Branding -->
        <div class="flex items-center gap-3">
          <div class="flex flex-col">
            <div class="flex items-center gap-1.5">
              <span class="px-2 py-0.5 bg-blue-700 text-white font-black text-xs tracking-wider rounded">
                HCL JIGSAW
              </span>
              <span class="text-xs font-bold text-sky-700 hidden sm:inline">Student Challenge</span>
            </div>
            <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight flex items-center gap-1">
              <span>Student Health Passport</span>
              <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 border border-emerald-200 px-1.5 py-0.2 rounded-full hidden md:inline">v2.4 Ready</span>
            </h1>
          </div>
        </div>

        <!-- Center: Quick Student Switcher Dropdown -->
        <div class="hidden lg:flex items-center gap-2">
          <label for="global-student-select" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Active Student:</label>
          <select id="global-student-select" class="text-xs font-bold py-1.5 px-3 border border-slate-300 rounded-lg bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 shadow-sm">
            <!-- Populated dynamically by app.js -->
          </select>
        </div>

        <!-- Right Side: Emergency Speed-Dial & High Alert Trigger -->
        <div class="flex items-center gap-2">
          <button id="toggle-emergency-mode-btn" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-bold rounded-lg transition flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
            <span class="hidden sm:inline">Emergency Mode</span>
          </button>

          <button id="call-108-header-btn" class="px-3.5 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-black rounded-lg shadow transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/></svg>
            <span>CALL 108</span>
          </button>
        </div>

      </div>
    </div>

    <!-- NAVIGATION TABS -->
    <nav class="bg-white border-t border-slate-100 px-4 sm:px-6 lg:px-8 overflow-x-auto">
      <div class="max-w-7xl mx-auto flex gap-1 whitespace-nowrap">
        <button data-tab-target="one-card" class="px-4 py-3 text-sm font-semibold border-b-2 border-sky-600 text-sky-600 bg-sky-50/50 flex items-center gap-2 transition-all">
          <span>📇</span>
          <span>1-Card Health Passport</span>
        </button>

        <button data-tab-target="nurse-station" class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center gap-2 transition-all">
          <span>🏥</span>
          <span>Nurse Emergency Station</span>
        </button>

        <button data-tab-target="annual-update" class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center gap-2 transition-all">
          <span>📋</span>
          <span>Annual Nurse Update</span>
          <span class="px-1.5 py-0.2 text-[10px] font-bold bg-amber-100 text-amber-800 rounded-full">Screen 3</span>
        </button>

        <button data-tab-target="pilot-testing" class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center gap-2 transition-all">
          <span>🧪</span>
          <span>Pilot Testing (10 Students)</span>
          <span class="px-1.5 py-0.2 text-[10px] font-bold bg-emerald-100 text-emerald-800 rounded-full">Consent Verified</span>
        </button>

        <button data-tab-target="nurse-feedback" class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center gap-2 transition-all">
          <span>👩‍⚕️</span>
          <span>School Nurse Evaluation</span>
          <span class="px-1.5 py-0.2 text-[10px] font-bold bg-amber-100 text-amber-800 rounded-full">4.95 ★</span>
        </button>

        <button data-tab-target="presentation" class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center gap-2 transition-all">
          <span>📊</span>
          <span>Presentation Deck (7 Slides)</span>
        </button>

        <button data-tab-target="incident-log" class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center gap-2 transition-all">
          <span>📝</span>
          <span>Incident Register</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="main-tab-content">
      <!-- Injected dynamically via app.js -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 py-6 text-xs text-slate-500 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between gap-4">
      <div class="space-y-0.5">
        <div class="font-bold text-slate-700">Student Health Passport • HCL Jigsaw Innovation Challenge</div>
        <div>Designed for Indian School Infirmaries, First Responders, and Pediatric Safety</div>
      </div>
      <div class="flex items-center gap-4 text-xs font-semibold">
        <span class="flex items-center gap-1.5 text-emerald-700">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          100% Offline-Ready
        </span>
        <span>•</span>
        <button onclick="window.appSwitchTab('pilot-testing')" class="text-sky-600 hover:underline">3-Student Pilot Data</button>
        <span>•</span>
        <button onclick="window.appSwitchTab('nurse-feedback')" class="text-sky-600 hover:underline">Nurse Rubric</button>
        <span>•</span>
        <button onclick="window.appSwitchTab('presentation')" class="text-sky-600 hover:underline">View Slides</button>
      </div>
    </div>
  </footer>

  <!-- DYNAMIC MODALS OVERLAY -->
  <div id="modal-container" class="hidden">
    <!-- Populated on-demand by app.js -->
  </div>

  <!-- APPLICATION SCRIPTS -->
  <script src="src/js/qr_generator.js"></script>
  <script src="src/js/data.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
